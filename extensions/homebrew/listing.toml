details = "In disk mode, copy a package folder to /Reprise/Games/<id>/ or /Reprise/Apps/<id>/. Games appear in Extras > Games beside the stock ones; Apps gets its own row under Extras. Manifests in those two folders skip Apple's signature check; games under iPod_Control keep it."

