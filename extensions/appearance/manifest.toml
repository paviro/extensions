id = "appearance"
name = "Appearance"
description = "Dark Mode, Accent and themes that recolour the screens and replace the artwork."
version = "0.1.0"
author = "RepriseOS and RevolaOS contributors"
license = "GPL-3.0-only"
api = "1.89"
category = "system"
content = "Themes"

[libraries]
optional = ["reprise"]

[[module]]
name = "main"
trigger = "always"

[[module]]
name = "switch"
trigger = "manual"

[[asset]]
name = "settings-appearance"
file = "assets/settings-appearance.png"
pane = "icon"

[[asset]]
name = "settings-theme"
file = "assets/settings-theme.png"
pane = "icon"

[[asset]]
name = "settings-moon"
file = "assets/settings-moon.png"
pane = "icon"

[[asset]]
name = "settings-accent"
file = "assets/settings-accent.png"
pane = "icon"

[[asset]]
name = "settings-covers"
file = "assets/settings-covers.png"
pane = "icon"

[[asset]]
name = "settings-cover"
file = "assets/settings-cover.png"
pane = "icon"

[[asset]]
name = "classic"
file = "build/classic.rvt"
compress = false
